name: Core tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test persistence, retention and transcription contract
        run: swift test --scratch-path "$RUNNER_TEMP/suiji-tests"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install audio probe test dependency
        run: python3 -m pip install 'numpy>=2,<3'
      - name: Test long-recording reports and background configuration
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=scripts python3 -m unittest discover -s scripts/tests -v
